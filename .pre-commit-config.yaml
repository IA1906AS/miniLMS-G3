# Tầng 1 của quality gate: chỉ chạy thứ nhanh (<10s).
# Test đầy đủ nằm ở `scripts/gate.ps1` (local) và CI (bắt buộc xanh mới merge).
#
# Lưu ý môi trường: một số hook của pre-commit-hooks bị Windows Application Control
# chặn trên máy dev hiện tại (WinError 4551), nên bộ hook ở đây chỉ giữ những hook
# chạy được. Phần còn lại (EOF, merge conflict, file lớn) do review + CI đảm bảo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
