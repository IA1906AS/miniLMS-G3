[project]
name = "myapp"
version = "0.1.0"
description = "Project mẫu được quản lý bằng uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

# Quy tắc lint: E,W=pycodestyle, F=pyflakes, I=isort, UP=pyupgrade,
# B=bugbear, SIM=simplify, N=pep8-naming
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["main"]

[tool.ruff.format]
quote-style = "double"

# mypy: strict vừa phải, chạy xanh với code hiện tại.
# Muốn chặt hơn nữa thì thêm: strict = true (+ chú thích kiểu cho mọi hàm).
[tool.mypy]
python_version = "3.12"
files = ["main.py", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
strict_equality = true

# pytest + coverage tích hợp sẵn
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=main --cov-report=term-missing"

[tool.coverage.run]
source = ["main"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
